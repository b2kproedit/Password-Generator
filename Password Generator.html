<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; color: #fff; margin: 0; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    button { width: 100%; padding: 10px; background: #0f3460; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #e94560; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Password Generator</h3>
    <input type="text" id="pass" readonly placeholder="Generated Password">
    <div class="controls">
      <label>Length: <input type="number" id="len" min="6" max="30" value="12"></label>
      <label><input type="checkbox" id="sym" checked> Include Symbols</label>
    </div>
    <button onclick="genPass()">Generate Password</button>
  </div>
  <script>
    function genPass() {
      const len = document.getElementById('len').value;
      const sym = document.getElementById('sym').checked;
      let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      if (sym) chars += "!@#$%^&*()_+-=[]{}|";
      let res = "";
      for (let i = 0; i < len; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      document.getElementById('pass').value = res;
    }
  </script>
</body>
</html>
